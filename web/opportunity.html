<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaScope | Opportunity Detail</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a, #020617);
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}

.grid-bg {
  position: fixed;
  inset: 0;
  opacity: 0.08;
  background-image:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 48px 48px;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 10;
  max-width: 1300px;
  margin: auto;
  padding: 40px 30px 80px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 40px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: rgba(59,130,246,0.12);
  border: 1px solid rgba(96,165,250,0.35);
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 0 0 auto;
}

.logo svg {
  width: 34px;
  height: 34px;
}

.brand h1 {
  font-size: 1.4rem;
  font-weight: 800;
}

.brand p {
  color: #94a3b8;
  font-size: 0.9rem;
}

.back-btn {
  padding: 14px 24px;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  background: rgba(59,130,246,0.15);
  border: 1px solid rgba(96,165,250,0.35);
  font-weight: 700;
  white-space: nowrap;
}

.hero {
  margin-bottom: 26px;
}

.hero-top {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.hero h2 {
  font-size: 3rem;
  font-weight: 900;
}

.hero p,
.muted {
  color: #cbd5e1;
  line-height: 1.7;
}

.buy-score {
  color: #dbeafe;
  font-size: 1.15rem;
  font-weight: 800;
}

.recommendation-badge {
  display: inline-flex;
  align-items: center;
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 800;
  border: 1px solid rgba(148,163,184,0.22);
  background: rgba(148,163,184,0.12);
  color: #e2e8f0;
  white-space: nowrap;
}

.recommendation-buy {
  color: #bbf7d0;
  background: rgba(34,197,94,0.12);
  border-color: rgba(34,197,94,0.35);
}

.recommendation-watch {
  color: #fde68a;
  background: rgba(245,158,11,0.12);
  border-color: rgba(245,158,11,0.35);
}

.recommendation-avoid {
  color: #fecaca;
  background: rgba(239,68,68,0.12);
  border-color: rgba(239,68,68,0.35);
}

.status-banner {
  display: none;
  margin-bottom: 24px;
  padding: 16px 18px;
  border-radius: 14px;
  color: #fecaca;
  background: rgba(239,68,68,0.12);
  border: 1px solid rgba(248,113,113,0.3);
}

.section {
  margin-top: 26px;
}

.section-title {
  margin-bottom: 14px;
}

.section-title h3 {
  font-size: 1.05rem;
  text-transform: uppercase;
  letter-spacing: 0;
  color: #93c5fd;
}

.grid {
  display: grid;
  gap: 18px;
}

.grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.grid-5 {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 24px;
  border-radius: 18px;
  backdrop-filter: blur(16px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.32);
}

.card h4 {
  color: #94a3b8;
  font-size: 0.78rem;
  text-transform: uppercase;
  margin-bottom: 12px;
  letter-spacing: 0;
}

.metric {
  font-size: 1.55rem;
  font-weight: 900;
  overflow-wrap: anywhere;
}

.list {
  display: grid;
  gap: 10px;
  list-style: none;
}

.list li {
  color: #d1d5db;
  line-height: 1.55;
  padding-left: 16px;
  position: relative;
}

.list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.7em;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #60a5fa;
}

@media(max-width: 1050px) {
  .grid-5,
  .grid-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media(max-width: 760px) {
  .container {
    padding: 28px 18px 60px;
  }

  .header {
    flex-direction: column;
    align-items: flex-start;
  }

  .hero h2 {
    font-size: 2.2rem;
  }

  .grid-2,
  .grid-3,
  .grid-5 {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 20px;
    border-radius: 16px;
  }
}
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="container">
  <div class="header">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="alphaGrad" x1="0" y1="0" x2="120" y2="120">
              <stop offset="0%" stop-color="#93C5FD"/>
              <stop offset="50%" stop-color="#3B82F6"/>
              <stop offset="100%" stop-color="#06B6D4"/>
            </linearGradient>
          </defs>
          <polygon points="60,10 95,30 95,75 60,110 25,75 25,30"
            stroke="url(#alphaGrad)" stroke-width="5"
            fill="rgba(59,130,246,0.08)" />
          <polygon points="60,38 76,54 60,70 44,54" fill="url(#alphaGrad)" />
        </svg>
      </div>

      <div>
        <h1>AlphaScope</h1>
        <p>Investor Opportunity</p>
      </div>
    </div>

    <a href="/" class="back-btn">Back To Dashboard</a>
  </div>

  <div class="status-banner" id="status-banner"></div>
  <main id="opportunity" aria-live="polite"></main>
</div>

<script>
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function append(parent, children) {
  children.filter(Boolean).forEach(child => parent.appendChild(child));
  return parent;
}

function showError(message) {
  const banner = document.getElementById('status-banner');
  const root = document.getElementById('opportunity');
  banner.textContent = message;
  banner.style.display = 'block';
  root.innerHTML = '';
}

function formatNumber(value, digits = 2) {
  const number = Number(value);
  if (!Number.isFinite(number)) return 'Unavailable';

  return new Intl.NumberFormat('en-US', {
    maximumFractionDigits: digits
  }).format(number);
}

function formatPercent(value, digits = 2) {
  const number = Number(value);
  if (!Number.isFinite(number)) return 'Unavailable';

  return new Intl.NumberFormat('en-US', {
    style: 'percent',
    maximumFractionDigits: digits
  }).format(number);
}

function formatPercentPoints(value, digits = 2) {
  const number = Number(value);
  if (!Number.isFinite(number)) return 'Unavailable';

  return `${formatNumber(number, digits)}%`;
}

function formatCurrency(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return 'Unavailable';

  return new Intl.NumberFormat('en-US', {
    style: 'currency',
    currency: 'USD',
    notation: Math.abs(number) >= 1000000 ? 'compact' : 'standard',
    maximumFractionDigits: 2
  }).format(number);
}

function recommendationClass(recommendation) {
  const normalized = String(recommendation || '').toLowerCase();

  if (normalized.includes('buy')) return 'recommendation-buy';
  if (normalized.includes('watch')) return 'recommendation-watch';
  if (normalized.includes('avoid')) return 'recommendation-avoid';

  return '';
}

function metricCard(label, value) {
  const card = el('div', 'card');
  card.appendChild(el('h4', '', label));
  card.appendChild(el('div', 'metric', value));
  return card;
}

function sectionShell(title) {
  const section = el('section', 'section');
  const heading = el('div', 'section-title');
  heading.appendChild(el('h3', '', title));
  section.appendChild(heading);
  return section;
}

function listCard(label, items) {
  const card = el('div', 'card');
  const list = el('ul', 'list');
  card.appendChild(el('h4', '', label));

  const safeItems = Array.isArray(items) && items.length ? items : ['No items reported.'];
  safeItems.forEach(item => list.appendChild(el('li', '', item)));
  card.appendChild(list);
  return card;
}

function renderOpportunity(item) {
  const root = document.getElementById('opportunity');
  const recommendation = item.recommendation || 'Unavailable';
  root.innerHTML = '';

  const hero = el('section', 'hero');
  const top = el('div', 'hero-top');
  const title = el('h2', '', item.symbol || 'Unavailable');
  const badge = el('span', `recommendation-badge ${recommendationClass(recommendation)}`.trim(), recommendation);

  append(top, [title, badge]);
  append(hero, [
    top,
    el('p', '', item.company || 'Company unavailable'),
    el('div', 'buy-score', `Buy Score: ${formatNumber(item.buy_score)}`)
  ]);

  const scores = sectionShell('Scores');
  const scoreGrid = el('div', 'grid grid-5');
  append(scoreGrid, [
    metricCard('Valuation Score', formatNumber(item.valuation_score)),
    metricCard('Financial Quality Score', formatNumber(item.financial_quality_score)),
    metricCard('Technical Score', formatNumber(item.technical_score)),
    metricCard('Dividend Score', formatNumber(item.dividend_score)),
    metricCard('Price Position Score', formatNumber(item.price_position_score))
  ]);
  scores.appendChild(scoreGrid);

  const metrics = sectionShell('Metrics');
  const metricsGrid = el('div', 'grid grid-3');
  append(metricsGrid, [
    metricCard('Sector', item.sector || 'Unavailable'),
    metricCard('PE Ratio', formatNumber(item.pe_ratio)),
    metricCard('ROE', formatPercent(item.roe)),
    metricCard('Dividend Yield', formatPercent(item.dividend_yield)),
    metricCard('Debt To Equity', formatNumber(item.debt_to_equity)),
    metricCard('Free Cash Flow', formatCurrency(item.free_cash_flow)),
    metricCard('RSI', formatNumber(item.rsi)),
    metricCard('SMA20', formatNumber(item.sma20)),
    metricCard('SMA50', formatNumber(item.sma50)),
    metricCard('SMA200', formatNumber(item.sma200)),
    metricCard('Distance From 52 Week Low', formatPercentPoints(item.distance_from_52w_low))
  ]);
  metrics.appendChild(metricsGrid);

  const analysis = sectionShell('Analysis');
  const analysisGrid = el('div', 'grid grid-2');
  append(analysisGrid, [
    listCard('Strengths', item.strengths),
    listCard('Risks', item.risks)
  ]);
  analysis.appendChild(analysisGrid);

  append(root, [hero, scores, metrics, analysis]);
}

async function loadOpportunity() {
  const params = new URLSearchParams(window.location.search);
  const symbol = String(params.get('symbol') || '').trim().toUpperCase();

  if (!symbol) {
    showError('Missing symbol. Open this page from the Investor Opportunities table.');
    return;
  }

  try {
    const res = await fetch('data/investor-rankings.json?t=' + Date.now(), {
      cache: 'no-store'
    });

    if (!res.ok) {
      throw new Error(`Investor rankings request failed: ${res.status}`);
    }

    const payload = await res.json();

    if (!payload || !Array.isArray(payload.rankings)) {
      throw new Error('Investor rankings payload is missing rankings array.');
    }

    const match = payload.rankings.find(item => String(item.symbol || '').toUpperCase() === symbol);

    if (!match) {
      showError(`No investor opportunity found for ${symbol}.`);
      return;
    }

    renderOpportunity(match);
  } catch (error) {
    console.error('Unable to load investor opportunity:', error);
    showError('Unable to load the latest AlphaScope investor opportunity payload.');
  }
}

loadOpportunity();
</script>

</body>
</html>
